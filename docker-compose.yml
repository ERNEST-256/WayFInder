services:
 postgres:
    image: postgres:16
    container_name: wayfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-WayFinderAdmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password for the database user}
      POSTGRES_DB: ${POSTGRES_DB:-WayFinder}
    ports:
      - "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:



    
